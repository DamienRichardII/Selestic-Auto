<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur — Selestic Auto</title>
<meta name="description" content="Simulez les couleurs et matières de votre intérieur avec Selestic Auto : sièges, volant, ceintures, ciel de toit, portes et coutures.">
<meta name="theme-color" content="#0a0c0b">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sim-masks.css">
</head>
<body data-page="simulateur">
<header id="header"></header>
<main>
<section class="page-hero"><img class="snake" src="assets/img/snake-left.png" alt="" aria-hidden="true"><div class="wrap"><span class="eyebrow">Simulateur</span><h1>Imaginez votre <span class='accent'>intérieur</span></h1></div></section>
<section style="padding-top:20px"><div class="wrap">
<div class="sim" id="sim">
<div class="sim-view"><div class="sim-photo" id="sim-photo" data-sc="1" role="img" aria-label="Aperçu photo de l’habitacle à personnaliser"></div>
<p class="sim-note">Aperçu illustratif : les teintes et matières réelles sont confirmées par Selestic lors du devis.</p></div>
<div class="sim-panel">
<h2>1. Choisissez une zone</h2><div class="filters" id="sim-tabs"></div>
<div id="sim-matbox"><h2>2. Matière</h2><div class="filters" id="sim-mats"></div></div>
<h2>3. Couleur : <span id="sim-cname" class="accent"></span></h2><div class="sw-grid" id="sim-sw"></div>
<div class="sim-actions"><button type="button" class="chip" id="sim-all">Appliquer cette couleur partout</button><button type="button" class="chip" id="sim-reset">Réinitialiser</button></div>
<div class="sim-rec"><h3>Votre configuration</h3><ul id="sim-rec"></ul></div>
<a class="btn btn-primary" id="sim-devis" href="devis.html">Demander un devis avec cette configuration</a>
</div></div></div></section>
</main>
<footer id="footer"></footer>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
